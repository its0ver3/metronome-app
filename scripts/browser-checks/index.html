<h1>Metronome browser checks</h1>
<p>Checks the production audio engine at low volume. Keep this page visible. The first test takes 30 seconds; the complete run takes about a minute. Results measure digital audio, not speaker or Bluetooth output.</p>
<button id="run">Run browser checks</button>
<button id="recover" disabled>Restart after closed audio context</button>
<p id="status" role="status">Ready</p><ol id="checks"></ol><pre id="result"></pre>
